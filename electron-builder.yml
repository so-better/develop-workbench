appId: com.lingkai.develop-workbench
productName: Develop Workbench
directories:
  buildResources: build
  output: release

afterPack: ./scripts/after-pack.cjs
files:
  - out/**/*
  - package.json
extraResources:
  - from: skills
    to: skills
  - from: build/icon.png
    to: icon.png
asar: true
# node-pty 使用 N-API 预编译产物，无需针对 Electron ABI 重新编译。
npmRebuild: false
asarUnpack:
  - node_modules/node-pty/**/*
mac:
  target:
    - dmg
    - zip
  # 固定自签名证书，保证辅助功能/自动化权限跨版本保留。
  identity: "Develop Workbench Self Signed"
  artifactName: ${name}-${version}-mac.${ext}
  category: public.app-category.developer-tools
  icon: build/icon.icns
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: ${name}-${version}-win.${ext}
  executableName: develop-workbench
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
